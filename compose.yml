services:
  db:
    image: postgres:18-alpine
    container_name: blog-app-fastapi-db
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fastapi

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

  redis:
    image: redis:8-alpine
    container_name: blog-app-fastapi-redis
    restart: unless-stopped

    ports:
      - "6379:6379"

volumes:
  postgres_data:
